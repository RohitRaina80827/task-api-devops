services:
  task-api:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: task-api:${REVISION:-local}
    ports: ["8000:8000"]
    environment:
      GIT_COMMIT: ${GIT_COMMIT:-local}
    mem_limit: 384m
    cpus: 0.75
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
volumes:
  postgres-data: